<!-- sales_plan_form.html -->

<form method="post">
  {% csrf_token %}
  <label for="id_target_sales">Целевые продажи:</label>
  <input type="number" id="id_target_sales" name="target_sales" required>

  <label for="id_start_date">Дата начала:</label>
  <input type="date" id="id_start_date" name="start_date" required>

  <label for="id_end_date">Дата окончания:</label>
  <input type="date" id="id_end_date" name="end_date" required>

  <input type="submit" value="Создать">
</form>
